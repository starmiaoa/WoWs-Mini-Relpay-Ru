name: Build & Release Windows Standalone EXE (Nuitka)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python & dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest -v

      - name: Build Windows standalone EXE (Nuitka), sign & package ZIP/7z/Setup.exe
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: uv run python scripts/build_release.py --allow-unsigned

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WoWs-Mini-Relpay-Ru-win64
          path: |
            dist/WoWs-Mini-Relpay-Ru-Setup-win64.exe
            dist/WoWs-Mini-Relpay-Ru-win64.zip
            dist/WoWs-Mini-Relpay-Ru-win64.7z

      - name: Check existing GitHub Release
        id: check_release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Publish GitHub Release (on tag push if not already published locally)
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WoWs-Mini-Relpay-Ru-Setup-win64.exe
            dist/WoWs-Mini-Relpay-Ru-win64.zip
            dist/WoWs-Mini-Relpay-Ru-win64.7z
          generate_release_notes: true
