name: Build & Release Windows Portable EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python & dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest -v

      - name: Build Windows portable EXE & ZIP
        run: uv run python scripts/build_release.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoWs-Mini-Relpay-Ru-win64
          path: dist/WoWs-Mini-Relpay-Ru-win64.zip

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WoWs-Mini-Relpay-Ru-win64.zip
          generate_release_notes: true
